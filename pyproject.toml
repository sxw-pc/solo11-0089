[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microtag-harvest"
version = "1.0.0"
description = "Offline semantic micro-annotation harvesting, contract checks, and audit reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "Jinja2>=3.1,<4",
    "lxml>=5.0,<6",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
microtag-harvest = "microtag_harvest.cli:main"

[tool.setuptools]
packages = ["microtag_harvest", "microtag_harvest.parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
